*Conditional Operator*


<!DOCTYPE html>
<html>
<head>
    <title>Conditional Operator</title>
</head>
<body>
    <h2>JavaScript Conditional Operator</h2>

    <script>
        let age = 20;

        let result = (age >= 18)
            ? "Eligible to vote"
            : "Not eligible to vote";

        document.write("Age: " + age + "<br>");
        document.write("Result: " + result);
    </script>
</body>
</html>
